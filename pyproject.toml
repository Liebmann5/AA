# /AA/pyproject.toml
# ─────────────────────────────────────────────────────────────────────────────
#  AA Monorepo — Workspace Root
#
#  Tool: uv (https://docs.astral.sh/uv)
#  Pattern: Virtual workspace root (no [project] table).
#    The root is a pure coordinator: it cannot be installed, imported, or
#    published. All real packages live under packages/.
#
#  Two audiences, two entry points, one dependency graph:
#
#    Contributors / CI (development, tests, gates, docs):
#      pip install uv          # bootstrap — uv is itself pip-installable
#      uv sync                 # creates .venv, installs members + dev group,
#                              # honors the committed uv.lock
#      uv sync --extra nlp     # optional feature extras, opt-in only
#
#    End users (just running AA — including worst-case library machines):
#      pip install auto_apply               # from PyPI (once published), or:
#      pip install packages/auto_apply      # from a source checkout
#      auto-apply                           # console script, or:
#      python -m auto_apply                 # module entry — both are declared
#
#    The frozen USB path (launch_portable.sh + PyInstaller) needs neither pip
#    nor Python on the host.
#
#  uv.lock is committed. CI resolves from it; do not float it casually —
#  bump deliberately with `uv lock --upgrade-package <name>` and commit.
# ─────────────────────────────────────────────────────────────────────────────

# ── Build System ─────────────────────────────────────────────────────────────
# uv_build lets the IDE and uv itself understand the workspace structure.
# Member packages can use any build backend (hatchling, setuptools, flit…).
[build-system]
requires      = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"


# ── Workspace Declaration ─────────────────────────────────────────────────────
# Glob pattern picks up every directory under packages/ that contains a
# pyproject.toml.  Adding a new sub-package is automatic — no need to touch
# this file.
[tool.uv.workspace]
members = ["packages/*"]


# ── Development Dependency Groups (PEP 735) ──────────────────────────────────
# Workspace-wide dev tooling, NOT shipped with any package. This is the ONLY
# declaration of this list anywhere — package optional-dependencies must not
# repeat it (tests/infrastructure/test_install_commands_exist.py enforces).
#
# pip's extras syntax (`pip install -e ".[dev]"`) cannot install this group —
# extras != groups. Recent pip (25.1+) can read groups via a dedicated
# `--group` flag, but the documented contributor path is `uv sync`, which is
# what CI runs. One tool, one declaration, one lockfile, no duplicates.
[dependency-groups]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    # Linting & formatting
    "ruff>=0.9.0",
    "black>=24.0.0",
    # Type checking
    "mypy>=1.8.0",
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings-python>=1.8.0",
    # Property-based testing (P3-9)
    "hypothesis>=6.90.0",
]


# ── Shared Tool Configuration ─────────────────────────────────────────────────
# All workspace members inherit these tool settings when run via `uv run`.

[tool.pytest.ini_options]
minversion   = "7.0"
testpaths    = ["packages/auto_apply/tests"]
pythonpath   = ["packages/auto_apply/src"]
addopts      = "--import-mode=importlib"          # required for uv monorepos
markers      = [
    "integration: tests that use a real SQLite DB or mock orchestrator",
    "slow: smoke/e2e tests that may need a browser or network access",
]

[tool.black]
line-length     = 88
target-version  = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PL", "T20"]
ignore = [
    "E501",     # Line-length: grandfathered pre-existing long lines
    "PLR2004",  # Magic values: numerics in comparisons are clear as-is
    "PLR0911",  # Too many return statements (pre-existing)
    "PLR0912",  # Too many branches (pre-existing)
    "PLR0913",  # Too many arguments (pre-existing)
    "PLR0915",  # Too many statements (pre-existing)
]

[tool.mypy]
# python_version matches the floor of packages/auto_apply's requires-python
# (">=3.10"). The gate checks AA against the Python AA supports — not against
# the newest Python some third-party stub happens to require.
#
# follow_imports = "skip": mypy analyzes only the files handed to it
# (src/auto_apply and tests/) and treats every third-party import as Any.
# This is the robust resolution of the numpy-stub problem previously
# documented here: numpy's shipped stubs use PEP 695 `type` syntax that mypy
# refused to parse under python_version < "3.12", and per-module
# follow_imports overrides were measured not to help because the parse error
# precedes override consultation. A global skip precedes parsing, so
# present-but-irrelevant libraries (numpy arriving transitively via the
# spacy / pandas / pyarrow extras) cannot break this gate again. AA's only
# direct numpy import — one unused line in a property test — is gone, so
# numpy is no longer in the default dependency graph at all.
#
# Tradeoff, stated plainly: misuse of third-party APIs inside AA is now
# opaque to this gate. AA's own cross-module calls are still fully checked —
# all AA modules are in the checked set, and
# tests/infrastructure/test_mypy_gate.py's canary exercises exactly that.
# ruff's F821 gate still catches used-but-never-defined names.
python_version      = "3.10"
strict              = false
follow_imports      = "skip"
ignore_missing_imports = true
plugins             = ["pydantic.mypy"]
