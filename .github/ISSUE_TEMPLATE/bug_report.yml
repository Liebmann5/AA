name: Bug report
description: Something behaved incorrectly or crashed
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this.

        **AutoApply is pre-alpha.** Please skim
        [STATUS.md](https://github.com/Liebmann5/AA/blob/main/packages/auto_apply/docs/STATUS.md)
        first — what you hit may be a documented gap rather than a bug, and that
        saves us both a round trip.

        **Do not report security problems here.** Use
        [SECURITY.md](https://github.com/Liebmann5/AA/blob/main/SECURITY.md).

  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      description: >
        AA's logs, screenshots and session reports routinely contain a real
        name, address, email, phone number and employment history, and the PII
        filter is known to be imperfect.
      options:
        - label: I have read anything I am attaching and removed personal data.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did AA do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it.
      placeholder: |
        1. Launch with `python -m auto_apply --cli`
        2. Choose entry point …
        3. …
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - GUI
        - CLI
        - Both
        - Not applicable / library use
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where in the run
      options:
        - Install or first launch
        - Profile setup / onboarding
        - Session configuration
        - Discovery
        - Vetting
        - Application / form filling
        - Submission
        - Reporting or export
        - Shutdown / teardown
        - Somewhere else
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2 / Ubuntu 24.04 / macOS 14.5 arm64"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4 — output of `python --version`"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
      placeholder: "c415338"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 152, or 'none installed'"

  - type: dropdown
    id: hardware
    attributes:
      label: Machine
      description: AA targets worst-case hardware, so this is a first-class detail.
      options:
        - My own computer, 8 GB RAM or more
        - My own computer, under 8 GB RAM
        - Shared, library or school computer
        - Running from a USB stick (portable mode)
        - Virtual machine or container
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Gate output (optional but very useful)
      description: >
        From `packages/auto_apply`, run the four gates and paste anything red.
      render: text
      placeholder: |
        uv run pytest tests -q -p no:cacheprovider -rs
        uv run ruff check src --select F821 --output-format concise
        uv run mypy --config-file ../../pyproject.toml src/auto_apply
        uv run mypy --config-file ../../pyproject.toml --explicit-package-bases tests

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Redacted. A traceback is usually enough.
      render: text
