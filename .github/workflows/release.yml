# Release build provenance and replay attestation (item 10, part B).
#
# Runs ONLY on a published GitHub release — never on pull_request, so
# id-token: write and attestations: write (the Sigstore signing identity)
# can never be reached by code from a fork. Top-level permissions are empty;
# every job declares its own least-privilege set.
# tests/infrastructure/test_release_workflow.py pins all of this.
#
# The two attestation claims (G1), each one sentence a reviewer can check
# with `gh attestation verify`:
#   replay  — "at this commit, the committed fixture corpus replays to these
#              replay.jsonl / manifest.json bytes, computed on a GitHub-hosted
#              runner" (environment.json is deliberately NOT attested: it is
#              not part of the replay result);
#   build   — "this sdist and wheel were built from this commit by this
#              repository's release workflow."
# Neither claims the code is correct. See docs/developer_guide/releasing.md.

name: Release

on:
  release:
    types: [published]

permissions: {}

env:
  PYTHONIOENCODING: utf-8
  # Same rule as ci.yml: a uv-MANAGED interpreter on every leg, so an
  # environment difference cannot masquerade as a code difference.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  versions:
    name: Tag, package and citation versions must agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The docs gate already pins pyproject == CITATION.cff on every push;
      # this step adds the tag as the third vote at the only moment it
      # exists. A disagreement exits 1 before ANY attesting job starts.
      - name: Refuse to publish on a version disagreement
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c "import os,pathlib,re,sys; v=lambda p: re.search(r'^version\s*[:=]\s*\"?([0-9][^\"\s]*)\"?', pathlib.Path(p).read_text(encoding='utf-8'), re.M).group(1); pkg=v('packages/auto_apply/pyproject.toml'); cff=v('CITATION.cff'); tag=os.environ['TAG_NAME'].lstrip('v'); print(f'tag={tag} pyproject={pkg} citation={cff}'); sys.exit(0 if tag == pkg == cff else 1)"

  replay:
    name: Replay the committed corpus and attest the digest
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace dependencies (uv, never pip)
        run: uv sync

      # The library-level proof, already pinned on all six CI legs.
      - name: The committed corpus must replay to the committed bytes
        working-directory: packages/auto_apply
        run: uv run pytest tests/research/test_replay.py::test_the_fixture_corpus_replays_to_the_committed_bytes -q -p no:cacheprovider

      # The CLI-level proof: the bytes to be attested come from the same
      # command a user runs, not only from the library the test calls.
      - name: Regenerate the replay outputs for attestation
        working-directory: packages/auto_apply
        env:
          AA_DATA_DIR: ${{ runner.temp }}/aa_data
        run: uv run python -m auto_apply --replay tests/fixtures/replay/corpus --replay-out replay_out

      - name: The regenerated bytes must equal the committed expected digest
        working-directory: packages/auto_apply
        run: |
          uv run python -c "import pathlib,sys; out=pathlib.Path('replay_out'); exp=pathlib.Path('tests/fixtures/replay/expected'); bad=[n for n in ('replay.jsonl','manifest.json') if (out/n).read_bytes() != (exp/n).read_bytes()]; print('replay outputs match the committed expected bytes') if not bad else print('MISMATCH: ' + ', '.join(bad)); sys.exit(1 if bad else 0)"

      - name: Attest replay.jsonl
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/auto_apply/replay_out/replay.jsonl

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/auto_apply/replay_out/manifest.json

  build:
    name: Build and attest the sdist and wheel
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        working-directory: packages/auto_apply
        # --out-dir is load-bearing: in a workspace member, bare `uv build`
        # writes to the WORKSPACE ROOT's dist/ (measured, uv 0.8.17), and
        # the attest and upload globs below would match nothing.
        run: uv build --out-dir dist

      - name: Attest the sdist and wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/auto_apply/dist/*

      - name: Upload the artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} packages/auto_apply/dist/*
