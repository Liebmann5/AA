# Master capability ledger for the page comprehension toolkit (pass 3), part 1 of 4 and root.
# The ledger is four YAML files: this root (schema, categories, part list, part-1 rows), 02_ledger_part2.yaml, 02_ledger_part3.yaml and 02_ledger_part4.yaml.
# Coverage against frozen reference lists (APG, WAI-ARIA roles, HTML controls, engine steps, signatures, views): 02_ledger_coverage.yaml.
# Each YAML file has a Markdown rendering of the same name; YAML and Markdown must agree row for row and status for status.
# Keys: id, cat, item, src (>=3 independent sources for a phenomenon), st, tool, ver, ev.
# st: "[x]" proven live on three sources by AA's own runs | "[~]" partial (code and/or fixture, no three-source live proof)
#     | "[ ]" not capable | "[?]" unknown (evidence recorded, human decides). No row is "[x]".
# src tags: O = observed live in pass 2, environment cloud, with specimen IDs (pass-2 observations; the archive was not retained, and each row records what was observed);
#           R = recorded in AA's own evidence (environment owner unless stated); K = recalled, unverified.
# tool column: T-nnn = CT-T-nnn, ALG-nnn = CT-ALG-nnn, FR-nnn = CT-FR-nnn.
# ver codes: U unit pin on fixture, P property test, R replay, L live run on the frozen set, M measurement, A analysis, X experiment.
