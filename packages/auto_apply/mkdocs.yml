# -----------------------------------------------------------------------------
# Site Information
# -----------------------------------------------------------------------------
site_name: Auto-Apply
site_description: 'An autonomous agent for discovering, vetting, and applying for jobs.'
site_author: 'Nicholas Liebmann'
repo_url: 'https://github.com/Liebmann5/AA'

# -----------------------------------------------------------------------------
# Theme Configuration (Material for MkDocs)
# -----------------------------------------------------------------------------
theme:
  name: material
  logo: assets/logo.svg # (Optional) You can add a logo file later
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

# -----------------------------------------------------------------------------
# Navigation Structure
# -----------------------------------------------------------------------------
nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting_started/index.md
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quick_start.md
    - Configuration: getting_started/configuration.md
  - User Guide:
    - Overview: user_guide/index.md
    - Running a Job Hunt: user_guide/running_a_job_hunt.md
    - Understanding the Output: user_guide/understanding_output.md
    - Profiles & Privacy: user_guide/profiles_and_privacy.md
    - Admin Policy: user_guide/admin_policy.md
  - Developer Guide:
    - Overview: developer_guide/index.md
    - Architecture Overview: developer_guide/architecture_overview.md
    - Contribution Workflow: developer_guide/contribution_workflow.md
    - Project Setup: developer_guide/project_setup.md
    - Running Tests: developer_guide/running_tests.md
    - Adding an ATS Platform: developer_guide/adding_an_ats_platform.md
  - Architecture Deep Dive:
    - Overview: architecture/index.md
    - Agent Lifecycle: architecture/agent_lifecycle.md
    - Core Abstractions: architecture/core_abstractions.md
    - Browser Cascade: architecture/browser_cascade.md
    - Evasion Framework: architecture/evasion_framework.md
    - Discovery Strategies: architecture/discovery_strategies.md
    - Vetting Pipeline: architecture/vetting_pipeline.md
    - Application Engine: architecture/application_engine.md
  - Architecture Decision Records:
    - Overview: adr/index.md
  - Deployment:
    - Overview: deployment/index.md
    - Docker: deployment/docker.md
    - Enterprise Admin Policy: deployment/enterprise_admin_policy.md
    - PyInstaller Portable Build: deployment/pyinstaller_portable.md
  - Research Module:
    - Overview: research_module/index.md
    - Data Format: research_module/data_format.md
    - Signals Taxonomy: research_module/signals_taxonomy.md
  - API Reference: api_reference/index.md
  - FAQ: faq.md
  - Glossary: glossary.md

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - search # Built-in search plugin
  - mkdocstrings:
      # This tells the plugin to look for docstrings in your Python code
      handlers:
        python:
          paths: [src/auto_apply]
          # We tell it we used Google-style docstrings
          options:
            docstring_style: google
            show_root_heading: yes
            show_source: yes