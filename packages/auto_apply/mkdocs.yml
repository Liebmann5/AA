  - FAQ: faq.md

# Retired documents live under docs/old_retired_files/ so retire.py and the
# ledger can reach them, but they are history, not documentation. Without this,
# all seven are copied into the built site and published - including a
# superseded install guide and a changelog that claimed a release which never
# happened. They stay on disk; they stop being published.
exclude_docs: |
  old_retired_files/

# validation.anchors is deliberately NOT raised to `warn`. The table of
# contents in AA_ARCHITECTURE_BIBLE.md uses GitHub's double-hyphen slug for
# headings containing an em-dash; python-markdown collapses it to a single
# hyphen. That document is read on GitHub and on this site, and the two
# slugify differently -- correcting it for one breaks the other. The links
# work where most people read that file. Do not "fix" this into a broken state.

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Liebmann5/AA
      name: AutoApply on GitHub
