name: greenhouse
description: >
  Greenhouse ATS — used by thousands of tech and growth-stage companies.
  Applications are typically single-page with a file-upload resume field.

url_patterns:
  - "*.greenhouse.io/jobs/*"
  - "boards.greenhouse.io/*/jobs/*"
  - "app.greenhouse.io/*/jobs/*"
  - "job-boards.greenhouse.io/*/jobs/*"
  # EU-hosted boards (reported by several Greenhouse API clients; no
  # first-party page found, 2026-11-08).
  - "job-boards.eu.greenhouse.io/*/jobs/*"

# The platform's own domains (a host equal to one, or a subdomain of one).
# Research analysis groups destinations by these, so one platform counts
# as one destination however it names its tenants (acme.myworkdayjobs.com
# and boards.greenhouse.io/acme are each one platform). Custom domains an
# employer points at the platform are not listed and cannot be.
hosts:
  - "greenhouse.io"

login_wall_signals:
  - "sign in to continue"
  - "log in to apply"
  - "create an account to apply"
  - "you must be logged in"

success_signals:
  - "your application has been submitted"
  - "thank you for applying"
  - "application submitted successfully"
  - "we've received your application"
  - "your application is complete"

form_root_selector: "#application_form"
submit_button_selector: "button#submit_app, input[type='submit'], button[type='submit']"
multi_step: false

tenancy: path
search_restriction: "boards.greenhouse.io"
search_restriction_status: measured
search_restriction_verified_on: "2026-11-08"
search_restriction_source: "Measured 2026-11-08 by the owner on Google: site:boards.greenhouse.io (\"Software Engineer\") returned 9 of 9 organic results on the platform's hosts (owner capture 20261108-175626); site:job-boards.greenhouse.io, the newer board host, also returned 9 of 9 on that host (20261108-175734), so this restriction misses postings that live only there. Bing (same day) returned one identical list of boards.greenhouse.io results for all seven platform searches, so Bing is not admitted"
search_restriction_engines: [google]
terminal_patterns: []

notes: >
  Greenhouse forms are server-rendered. Rarely requires login for external
  applicants. Resume upload uses input[type=file][name=resume].
  Demographic fields (EEO) appear at the end of the form as optional.
