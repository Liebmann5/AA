name: greenhouse
description: >
  Greenhouse ATS — used by thousands of tech and growth-stage companies.
  Applications are typically single-page with a file-upload resume field.

url_patterns:
  - "*.greenhouse.io/jobs/*"
  - "boards.greenhouse.io/*/jobs/*"
  - "app.greenhouse.io/*/jobs/*"
  - "job-boards.greenhouse.io/*/jobs/*"

login_wall_signals:
  - "sign in to continue"
  - "log in to apply"
  - "create an account to apply"
  - "you must be logged in"

success_signals:
  - "your application has been submitted"
  - "thank you for applying"
  - "application submitted successfully"
  - "we've received your application"
  - "your application is complete"

form_root_selector: "#application_form"
submit_button_selector: "button#submit_app, input[type='submit'], button[type='submit']"
multi_step: false

notes: >
  Greenhouse forms are server-rendered. Rarely requires login for external
  applicants. Resume upload uses input[type=file][name=resume].
  Demographic fields (EEO) appear at the end of the form as optional.
