name: workable
description: >
  Workable — path tenancy (apply.workable.com/<company>/j/<id>/apply/).
  Sample: https://apply.workable.com/last-call-media/j/FF37BE66C5/apply/
url_patterns:
  - "apply.workable.com/*"
hosts:
  - "workable.com"
multi_step: false
tenancy: path
search_restriction: "apply.workable.com"
search_restriction_status: measured
search_restriction_verified_on: "2026-11-08"
search_restriction_source: "Measured 2026-11-08 by the owner on Google: site:apply.workable.com (\"Software Engineer\") returned 8 of 8 organic results on the platform's hosts (owner capture 20261108-180011). Bing (same day) returned one identical list of boards.greenhouse.io results for all seven platform searches, so Bing is not admitted"
search_restriction_engines: [google]
terminal_patterns: []
