name: smartrecruiters
description: >
  SmartRecruiters — path tenancy (jobs.smartrecruiters.com/<company>/<id>).
  Sample: https://jobs.smartrecruiters.com/Jitterbit/743999952832064-web-developer
url_patterns:
  - "jobs.smartrecruiters.com/*/*"
hosts:
  - "smartrecruiters.com"
multi_step: false
tenancy: path
search_restriction: "jobs.smartrecruiters.com"
search_restriction_status: measured
search_restriction_verified_on: "2026-11-08"
search_restriction_source: "Measured 2026-11-08 by the owner on Google: site:jobs.smartrecruiters.com (\"Software Engineer\") returned 9 of 9 organic results on the platform's hosts (owner capture 20261108-175955). Bing (same day) returned one identical list of boards.greenhouse.io results for all seven platform searches, so Bing is not admitted"
search_restriction_engines: [google]
terminal_patterns: []
