name: freshteam
description: >
  Freshteam — subdomain tenancy (<company>.freshteam.com/jobs/...).
  Sample: https://findmine.freshteam.com/jobs/2lSE7VcqfO0g/software-engineer-remote
url_patterns:
  - "*.freshteam.com/jobs/*"
hosts:
  - "freshteam.com"
multi_step: false
tenancy: subdomain
search_restriction: "freshteam.com"
search_restriction_status: unverified
search_restriction_verified_on: ""
search_restriction_source: "Host from Nick's sample URL; not yet hand-measured"
terminal_patterns: []
