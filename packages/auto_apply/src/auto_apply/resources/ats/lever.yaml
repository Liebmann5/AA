name: lever
description: >
  Lever ATS — popular with high-growth startups and mid-sized tech companies.
  Clean React-based forms, usually single-page. EU tenants use a separate domain.

url_patterns:
  - "jobs.lever.co/*/apply*"
  - "jobs.eu.lever.co/*/apply*"
  - "hire.lever.co/*/apply*"
  # The posting itself: <tenant>/<posting UUID>, with or without /apply.
  # Live search results, 2026-11-08: jobs.lever.co/lendbuzz/0d9ef5fb-e31b-
  # 4a93-ad98-cb5970927c21 and jobs.eu.lever.co/leverdemo/cd1ea494-1629-
  # 4cb1-a1c7-5dbcc9dea545. Without these a Lever site search kept nothing:
  # every posting address was "off-shape". The UUID's four hyphens keep a
  # tenant's list page (jobs.lever.co/<tenant>) out.
  - "jobs.lever.co/*/*-*-*-*-*"
  - "jobs.eu.lever.co/*/*-*-*-*-*"

# The platform's own domains (a host equal to one, or a subdomain of one).
# Research analysis groups destinations by these, so one platform counts
# as one destination however it names its tenants (acme.myworkdayjobs.com
# and boards.greenhouse.io/acme are each one platform). Custom domains an
# employer points at the platform are not listed and cannot be.
hosts:
  - "lever.co"

login_wall_signals:
  - "sign in to apply"
  - "log in to continue"
  - "create an account"
  - "you need an account"

success_signals:
  - "your application has been submitted"
  - "application submitted"
  - "we received your application"
  - "thanks for applying"
  - "you've applied"

form_root_selector: ".application-form, form[data-qa='application-form'], main form"
submit_button_selector: >
  button[data-qa='btn-submit-application'],
  button[type='submit'],
  input[type='submit']
multi_step: false

tenancy: path
search_restriction: "jobs.lever.co"
search_restriction_status: unverified
search_restriction_verified_on: ""
search_restriction_source: "Host declared in this descriptor; not yet hand-measured (docs/developer_guide/verifying_platform_search.md)"
terminal_patterns: []

notes: >
  Lever forms are React SPAs. The submit button has a data-qa attribute in
  most versions. Resume upload: input[type=file] inside .resume-upload.
  Cover letter is a textarea with aria-label or placeholder containing "cover letter".
