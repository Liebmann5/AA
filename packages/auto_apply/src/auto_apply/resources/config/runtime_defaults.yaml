# Runtime defaults — the lowest tier of AA's three-tier configuration hierarchy.
#
# Values here are the fallback when neither admin policy nor user settings have
# specified something. All values must be conservative to protect worst-case
# users (library computer, 2GB RAM, metered internet, no admin rights).
#
# Override hierarchy (later wins):
#   runtime_defaults.yaml  →  UserSettings  →  AdminPolicy  →  LowResourceOverrides

# ─────────────────────────────────────────────────────────────────────────────
# Browser behaviour
# ─────────────────────────────────────────────────────────────────────────────
headless_mode: false
browser_timeout_seconds: 30
page_load_timeout_seconds: 20
# Max navigation attempts before giving up on a URL (bounded-retry).
navigation_retries: 3
occlusion_guard: true   #! refuse clicks that would land on an overlay
force_analysis_tier: ""   #! empty = router chooses per page
infinite_scroll_settle_s: 2.0
preferred_browser_order:
  - chrome
  - firefox
  - edge
  - safari

# Automation-framework fallback order for the browser cascade. Configurable and
# agnostic: the cascade tries frameworks in this order (browser choice within a
# framework still follows preferred_browser_order). 'static' is always the final
# fallback regardless of this list. Admin policy may override via config_overrides.
framework_order:
  - playwright
  - selenium
  - camoufox

# ─────────────────────────────────────────────────────────────────────────────
# Session limits  (conservative — safe for low-resource users)
# ─────────────────────────────────────────────────────────────────────────────
max_applications_per_session: 50
max_applications_per_company: 3
#! per-UTC-day cap, counted across sessions from the permanent applied_jobs
#! log. Distinct from max_applications_per_session, which is per-run and
#! in-memory. Overridden by ApplicationConfig.daily_application_limit.
daily_application_limit: 1000
cooldown_days_default: 180
max_discovery_results_per_query: 30

# ─────────────────────────────────────────────────────────────────────────────
# Resilience
# ─────────────────────────────────────────────────────────────────────────────
task_retry_limit: 3
network_reconnect_timeout_seconds: 300
checkpoint_interval_actions: 5

# ─────────────────────────────────────────────────────────────────────────────
# Evasion
# ─────────────────────────────────────────────────────────────────────────────
enable_human_timing: true
enable_fingerprint_spoofing: true
# Micro-timing (typing cadence, quick mouse movements)
min_action_delay_ms: 500           # floor for action pacing
max_action_delay_ms: 2000          # ceiling for action pacing
# Macro-timing (Page load reading, transition thinking times)
macro_pause_min_s: 1.2             # ↓ 2.5 → 1.2 — faster page-scan reading
macro_pause_max_s: 2.5             # ↓ 5.0 → 2.5 — no long stares
settle_min_s: 0.4                  # ↓ 0.8 → 0.4 — quicker post‑action settle
settle_max_s: 0.8                  # ↓ 1.5 → 0.8

# ─────────────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────────────
# [IRB] Research data collection is opt-in only; must never be true by default.
enable_research_collection: false
enable_company_batching: true
company_batch_threshold: 3
# "live_browser" | "static_fetch" | "auto"
discovery_strategy: live_browser
# "math" | "dom" | "aom" | "heuristic" | "auto"
perception_strategy: math

# ─────────────────────────────────────────────────────────────────────────────
# Data handling
# ─────────────────────────────────────────────────────────────────────────────
store_session_logs: true
log_retention_days: 30

# ─────────────────────────────────────────────────────────────────────────────
# Vetting workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
vetting:
  # Minimum fraction of required skills the user must possess (0.0–1.0).
  hard_skills_min_overlap: 0.5
  # Minimum SpaCy cosine similarity between job title and desired titles.
  role_alignment_threshold: 0.6
  # Fit scores in this range trigger GPT4All borderline reasoning.
  borderline_band: [0.45, 0.65]
  # Weighted contribution of each filter to the overall fit score (must sum ~1.0).
  filter_weights:
    ThrottlingFilter: 0.10
    SpatialLocationFilter: 0.15
    LogicFilters: 0.15
    ExperienceFilter: 0.15
    HardSkillsFilter: 0.20
    RoleAlignmentFilter: 0.25

# ─────────────────────────────────────────────────────────────────────────────
# Discovery workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
discovery:
  # Maximum concurrent source fetches (ThreadPoolExecutor max_workers).
  max_concurrent_sources: 1   #! MUST BE 1 when sharing a single live browser!
  # Maximum pages to paginate through per search query.
  max_pages_per_query: 1      #! 1 = today's single-page behaviour; raise to paginate.
  # Silent-degradation guard (S8k): a provider is benched for the session
  # only when its first-harvest yield AND page size both collapse versus its
  # own recorded baseline, and only after enough history exists to judge.
  degradation_collapse_ratio: 0.15      # yield <= 15% of baseline ...
  degradation_page_bytes_ratio: 0.25    # ... AND page bytes <= 25% of baseline
  degradation_min_samples: 3            # need >= 3 prior harvests to judge
  # Pause between switching search providers (faster engine switching).
  between_provider_pause_min: 1.0   # ↓ 2.0 → 1.0
  between_provider_pause_max: 2.0   # ↓ 5.0 → 2.0

# ─────────────────────────────────────────────────────────────────────────────
# Applications workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
applications:
  # Maximum form pages to navigate before aborting.
  max_pages: 10
  # Maximum interaction steps per page before aborting.
  max_steps_per_page: 15
  # Seconds to wait for DOM to stabilize after each navigation.
  dom_stabilization_timeout_s: 3.0  #! 8.0
  dom_stabilization_poll_interval_s: 0.25
  # Token budget for GPT4All custom-question answers.
  custom_answer_max_tokens: 150

  # ── Human-like interaction timing (BehaviorParameters / TimingProfile) ──
  # These feed BehaviorParameters.from_config() → TimingProfile.
  # Defaults shown are the *old* values; new values are ~50‑70% faster.

  inter_action_delay_ms: 400        # ↓ 1200 → 400 — faster field switching
  macro_pause_min_seconds: 0.4      # ↓ 0.8 → 0.4 — shorter reading time
  macro_pause_max_seconds: 1.2      # ↓ 2.5 → 1.2 — no long stares
  micro_delay_peak_ms: 30           # ↓ 50 → 30 — faster typing, ~80 WPM
  typing_wpm: 80                    # ↑ 60 → 80 — young professional speed
  typing_jitter_fraction: 0.15      # ↓ 0.20 → 0.15 — less wobble, still natural
  thinking_pause_probability: 0.05  # ↓ 1/15 ≈ 0.067 → 1/20 — fewer long pauses
  thinking_pause_min: 0.2           # ↓ 0.3 → 0.2
  thinking_pause_max: 0.6           # ↓ 0.8 → 0.6

# ─────────────────────────────────────────────────────────────────────────────
# Browser mouse & navigation (BehaviorParameters / TimingProfile)
# ─────────────────────────────────────────────────────────────────────────────
browser:
  mouse_move_steps: 4               # ↓ 5 → 4 — slightly fewer micro‑moves
  mouse_offset_min_px: 30           # ↓ 50 → 30 — tighter movements
  mouse_offset_max_px: 150          # ↓ 200 → 150
  mouse_step_delay_min: 0.05        # ↓ 0.2 → 0.05
  mouse_step_delay_max: 0.2         # ↓ 0.8 → 0.2

# ─────────────────────────────────────────────────────────────────────────────
# GPT4All local LLM settings
# ─────────────────────────────────────────────────────────────────────────────
gpt4all:
  # GGUF model filename — auto-downloaded to ~/.cache/gpt4all/ on first use.
  model: "Meta-Llama-3-8B-Instruct.Q4_0.gguf"
  # Default token budget per generation call.
  max_tokens: 512
  # Sampling temperature. Lower = more deterministic.
  temperature: 0.7
  # Inference device. "cpu" always works; "gpu" requires CUDA/Metal.
  device: "cpu"
