# Runtime defaults — the lowest tier of AA's three-tier configuration hierarchy.
#
# Values here are the fallback when neither admin policy nor user settings have
# specified something. All values must be conservative to protect worst-case
# users (library computer, 2GB RAM, metered internet, no admin rights).
#
# Override hierarchy (later wins):
#   runtime_defaults.yaml  →  UserSettings  →  AdminPolicy  →  LowResourceOverrides

# ─────────────────────────────────────────────────────────────────────────────
# Browser behaviour
# ─────────────────────────────────────────────────────────────────────────────
headless_mode: false
browser_timeout_seconds: 30
page_load_timeout_seconds: 20
#! Bound on resolving a Playwright element handle for a JS call (was a 30s
#! driver default; one stale element cost 30s per call down the click ladder).
js_handle_timeout_ms: 2000
# Max navigation attempts before giving up on a URL (bounded-retry).
navigation_retries: 3
occlusion_guard: true   #! refuse clicks that would land on an overlay
force_analysis_tier: ""   #! empty = router chooses per page
infinite_scroll_settle_s: 2.0
#! Bound on waiting for a scrolled pane's offset to settle before measuring
#! it (Playwright's wheel returns before the page scrolls; smooth scrolling
#! animates afterwards). Bounded always — a stuck pane costs one budget.
scroll_settle_timeout_s: 0.6

# ─────────────────────────────────────────────────────────────────────────────
# Pointer & wheel motion (the mouse tool)
# ─────────────────────────────────────────────────────────────────────────────
# Active profile and override slots. The three named profiles — "instant"
# (CI / fast replay), "human" (default: a fast human), and "careful"
# (slower, stealth-max) — carry their field values in exactly one place:
# domain/models/motion_profile.py, where every field is documented with its
# unit and its valid range.
motion:
  # "instant" | "human" | "careful"
  profile: human
  # Permit a synthetic JS click as the absolute last click fallback. Never
  # used on irreversible actions (form submits), regardless of this setting.
  allow_js_click: true
  # Per-field overrides applied onto the ACTIVE profile. Keys are
  # MotionProfile field names; an unknown key or an out-of-range value is
  # refused at startup, naming the key, the value and the allowed range.
  overrides: {}
  # Full profile redefinitions, keyed by profile name, merged over the
  # built-in profile of the same name.
  profiles: {}

preferred_browser_order:
  - chrome
  - firefox
  - edge
  - safari

# Automation-framework fallback order for the browser cascade. Configurable and
# agnostic: the cascade tries frameworks in this order (browser choice within a
# framework still follows preferred_browser_order). 'static' is always the final
# fallback regardless of this list. Admin policy may override via config_overrides.
framework_order:
  - playwright
  - selenium
  - camoufox

# ─────────────────────────────────────────────────────────────────────────────
# Session limits  (conservative — safe for low-resource users)
# ─────────────────────────────────────────────────────────────────────────────
max_applications_per_session: 50
max_applications_per_company: 3
#! per-UTC-day cap, counted across sessions from the permanent applied_jobs
#! log. Distinct from max_applications_per_session, which is per-run and
#! in-memory. Overridden by ApplicationConfig.daily_application_limit.
daily_application_limit: 1000
cooldown_days_default: 180
max_discovery_results_per_query: 30

# ─────────────────────────────────────────────────────────────────────────────
# Resilience
# ─────────────────────────────────────────────────────────────────────────────
task_retry_limit: 3
network_reconnect_timeout_seconds: 300
checkpoint_interval_actions: 5

# ─────────────────────────────────────────────────────────────────────────────
# Evasion
# ─────────────────────────────────────────────────────────────────────────────
enable_human_timing: true
enable_fingerprint_spoofing: true
# Micro-timing (typing cadence, quick mouse movements)
min_action_delay_ms: 500           # floor for action pacing
max_action_delay_ms: 2000          # ceiling for action pacing
# Macro-timing (Page load reading, transition thinking times)
macro_pause_min_s: 1.2             # ↓ 2.5 → 1.2 — faster page-scan reading
macro_pause_max_s: 2.5             # ↓ 5.0 → 2.5 — no long stares
settle_min_s: 0.4                  # ↓ 0.8 → 0.4 — quicker post‑action settle
settle_max_s: 0.8                  # ↓ 1.5 → 0.8

# ─────────────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────────────
# [IRB] Research COLLECTION is opt-in only and stays off until the user grants
# consent through the consent dialog (recorded in research_consent.db). This
# flag only controls whether research is OFFERED on this device at all; an
# admin policy can force it off (PolicyEnforcement flips it to false).
enable_research_collection: true
enable_company_batching: true
company_batch_threshold: 3
# "live_browser" | "static_fetch" | "auto"
discovery_strategy: live_browser
# "math" | "dom" | "aom" | "heuristic" | "auto"
perception_strategy: math
# Who reads search-results pages: "pagecomp" (the page-comprehension library;
# the math reader answers when pagecomp cannot read a page) or "legacy" (the
# math reader alone). Settings for its page reads: comprehension_access below.
serp_reader: pagecomp

# ─────────────────────────────────────────────────────────────────────────────
# Data handling
# ─────────────────────────────────────────────────────────────────────────────
store_session_logs: true
log_retention_days: 30
# Cleaned job-page copies (research, separate opt-in; see
# docs/RESEARCH_CONSENT_DIALOG.md) are deleted this many days after capture,
# and the oldest go first once all copies together pass page_copy_max_mb.
page_copy_keep_days: 90
page_copy_max_mb: 200

# ─────────────────────────────────────────────────────────────────────────────
# Vetting workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
vetting:
  # Minimum fraction of required skills the user must possess (0.0–1.0).
  hard_skills_min_overlap: 0.5
  # Minimum SpaCy cosine similarity between job title and desired titles.
  role_alignment_threshold: 0.6
  # Fit scores in this range trigger GPT4All borderline reasoning.
  borderline_band: [0.45, 0.65]
  # Weighted contribution of each filter to the overall fit score (must sum ~1.0).
  filter_weights:
    ThrottlingFilter: 0.10
    SpatialLocationFilter: 0.15
    LogicFilters: 0.15
    ExperienceFilter: 0.15
    HardSkillsFilter: 0.20
    RoleAlignmentFilter: 0.25

# ─────────────────────────────────────────────────────────────────────────────
# Discovery workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
discovery:
  # Maximum concurrent source fetches (ThreadPoolExecutor max_workers).
  max_concurrent_sources: 1   #! MUST BE 1 when sharing a single live browser!
  # Maximum pages to paginate through per search query.
  max_pages_per_query: 1      #! 1 = today's single-page behaviour; raise to paginate.
  # Silent-degradation guard (S8k): a provider is benched for the session
  # only when its first-harvest yield AND page size both collapse versus its
  # own recorded baseline, and only after enough history exists to judge.
  degradation_collapse_ratio: 0.15      # yield <= 15% of baseline ...
  degradation_page_bytes_ratio: 0.25    # ... AND page bytes <= 25% of baseline
  degradation_min_samples: 3            # need >= 3 prior harvests to judge
  #! Bound on proving a page advanced (fingerprint change after a template
  #! navigation or a control click). A page that does not provably change in
  #! time is "no change" — pagination stops, and the old page is never
  #! re-mined as a new one.
  pagination_change_timeout_s: 4.0
  # Pause between switching search providers (faster engine switching).
  between_provider_pause_min: 1.0   # ↓ 2.0 → 1.0
  between_provider_pause_max: 2.0   # ↓ 5.0 → 2.0

  # ── ATS-targeted (site-restricted) automated search ──────────────────────
  #! Off by default: automated queries stay byte-identical to before this
  #! feature existed. When on, discovery plans site:-restricted queries across
  #! ats_platforms instead of the generic "{title} jobs in {location}" query.
  use_ats_site_search: false
  #! ATS platform names to target (a file name in resources/ats/, e.g.
  #! greenhouse). Only platforms whose restriction is vendor-documented or
  #! hand-measured are planned; 'unverified' platforms are excluded from
  #! automation until verified (see
  #! docs/developer_guide/verifying_platform_search.md).
  ats_platforms: []
  #! Composition strategy for site-restricted queries. 'per_platform' writes
  #! one site:-restricted query per platform per engine; further strategies
  #! plug in through the planner's registry.
  site_search_strategy: per_platform

# ─────────────────────────────────────────────────────────────────────────────
# Accessibility — how AA works with the person (docs/adr/024)
# ─────────────────────────────────────────────────────────────────────────────
# The person's own choices live in their profile (accessibility_preferences);
# a value left unset there uses the default below. AA stores settings, never
# the reason for them, and never uses them to answer an application form.
accessibility:
  # How long AA waits for your answers (WCAG 2.2 SC 2.2.1): "1x" standard,
  # "3x" / "10x" / "20x" times as long, or "off" — no limit: AA waits until
  # you answer or stop the session (stopping always releases every question).
  time_limits: "1x"
  # When AA cannot answer a question on a form, offer it in AA's own window:
  # pick from the form's choices, or type your answer, and AA enters it and
  # checks that it took. Off: you answer in the website's form, as before.
  answer_in_aa: false
  # When AA asks you to answer in the browser, move the keyboard focus to the
  # first such question and scroll it into view (no animation).
  focus_asked_field: true
  # Terminal: no screen redraws, no box drawing, every choice read in full.
  screen_reader_mode: false
  # No animation and no screen redraws.
  reduced_motion: false
  # AA's window colours and text size.
  high_contrast: false
  font_scale: 1.0
  # When AA hands you a human-verification challenge, mention that many offer
  # an audio version (the headphone or speaker button).
  audio_challenge_hint: false

# ─────────────────────────────────────────────────────────────────────────────
# Applications workflow tuning
# ─────────────────────────────────────────────────────────────────────────────
applications:
  # Maximum form pages to navigate before aborting.
  max_pages: 10
  #! Bounded wheel-scan of a form page BEFORE analysis so lazy sections
  #! render; the tool then wheels back to the top. Each step is measured.
  form_reveal_max_scrolls: 8
  # Maximum interaction steps per page before aborting.
  max_steps_per_page: 15
  # Seconds to wait for DOM to stabilize after each navigation.
  dom_stabilization_timeout_s: 3.0  #! 8.0
  dom_stabilization_poll_interval_s: 0.25
  # Token budget for GPT4All custom-question answers.
  custom_answer_max_tokens: 150
  #! Phase 0: when the step engine fails to build, the old form filler
  #! (which skips the pre-write review) runs only if this is true.
  legacy_fallback: false
  #! Phase 0 day-one record: after a submit click, how often AA looks at the
  #! page (ms) and for how long at most (s), noting when each outcome channel
  #! first fires. The verdict is still made from the final read.
  outcome_poll_ms: 500
  outcome_watch_s: 15.0

  # ── The application step engine (read, decide, act, verify, advance) ──
  # "steps": the step engine fills every step of the form (default).
  # "legacy": the pre-2026-11 page loop (kept selectable until it is retired).
  form_engine: "steps"
  # When AA may ask you, in the browser window, for answers it does not have:
  #   auto   — when you asked to review before submitting (or asked to be
  #            consulted on unsure fields): you are at the window anyway
  #   always — whenever the review prompt can reach you
  #   never  — never; an unanswerable required question ends the application
  assist_mode: "auto"
  # Seconds AA waits for you to answer before moving on — the standard wait,
  # scaled (or removed) by accessibility.time_limits.
  assist_timeout_s: 900
  # At most this many "please answer these" prompts per form step.
  max_assists_per_step: 2
  # Pause after AA fills each step so you can check it before AA moves on.
  review_each_step: false
  # Reuse the answers you give in place for the rest of this session (kept in
  # memory only, never written to disk). An answer specific to one employer
  # (open-ended, about "here"/"us", or naming it) is reused only for it.
  remember_answers: true
  # Where answers come from, in order. session = your answers earlier this
  # session; profile = your profile; saved = your custom answer templates;
  # generated = drafts by the local text model (only with generated_answers).
  answer_sources: ["session", "profile", "saved", "generated"]
  # Let the local text model draft open-ended answers. Off by default: a
  # model can add claims you never made, so every draft is flagged for your
  # review before submitting.
  generated_answers: false
  # Work-authorisation and sponsorship questions: "profile" answers them from
  # your profile's legal answers (flagged for your review); "ask" always asks
  # you in place instead.
  legal_answers: "profile"
  # An answer below this confidence is not used.
  min_answer_confidence: 0.75
  # Which answers AA may send without showing you first (docs/adr/026):
  #   never     — every answer AA wrote, matched by meaning, or took from a
  #               sensitive part of your profile is shown to you (default)
  #   own_words — your own words go without review: profile facts, saved
  #               answers matched word for word, your answers this session
  #   matched   — also saved answers matched by meaning
  #   drafts    — also AI drafts that pass AA's checks
  # Independent of sending without asking (human_review_checkpoints): AA
  # never sends an answer you still have to see.
  answer_trust: "never"
  # When AA shows you those answers: each (as each is filled), page (all of a
  # page's before moving on), end (all before sending).
  review_timing: "end"
  # Any answer below this confidence is shown to you, whatever answer_trust says.
  review_below_confidence: 0.8
  # Keep values the site or you already put in a field (a résumé parse, a
  # browser extension). True replaces them with your profile's values.
  overwrite_prefilled: false
  # Tick a required "I certify / I agree" box. Optional boxes (job alerts,
  # marketing, keeping your data) are always left unticked.
  acknowledge_required: true
  # When typing could not set a value (a masked or date widget), set it by
  # script and record that it was done. False never sets values by script.
  script_fill_fallback: true
  # Answers longer than this are typed a few words at a time.
  type_chunk_threshold: 240
  # How closely an answer must match a listed option to be chosen.
  option_match_threshold: 0.6
  # Seconds to wait for an upload to be processed (résumé parsing), and the
  # minimum quiet time before AA reads the form again.
  upload_settle_s: 8.0
  upload_quiet_min_s: 1.5
  # Reading pause before each question: milliseconds per character of the
  # question, capped. Set either to 0 for no reading pause.
  reading_pause_ms_per_char: 18
  reading_pause_max_s: 2.0
  # Bounds: questions handled per step; hops to reach the form (frames count).
  max_questions_per_step: 80
  max_apply_hops: 3

  # ── Human-like interaction timing (BehaviorParameters / TimingProfile) ──
  # These feed BehaviorParameters.from_config() → TimingProfile.
  # Defaults shown are the *old* values; new values are ~50‑70% faster.

  inter_action_delay_ms: 400        # ↓ 1200 → 400 — faster field switching
  macro_pause_min_seconds: 0.4      # ↓ 0.8 → 0.4 — shorter reading time
  macro_pause_max_seconds: 1.2      # ↓ 2.5 → 1.2 — no long stares
  micro_delay_peak_ms: 30           # ↓ 50 → 30 — faster typing, ~80 WPM
  typing_wpm: 80                    # ↑ 60 → 80 — young professional speed
  typing_jitter_fraction: 0.15      # ↓ 0.20 → 0.15 — less wobble, still natural
  thinking_pause_probability: 0.05  # ↓ 1/15 ≈ 0.067 → 1/20 — fewer long pauses
  thinking_pause_min: 0.2           # ↓ 0.3 → 0.2
  thinking_pause_max: 0.6           # ↓ 0.8 → 0.6

# ─────────────────────────────────────────────────────────────────────────────
# GPT4All local LLM settings
# ─────────────────────────────────────────────────────────────────────────────
# ─── Storage (Phase 0) ───────────────────────────────────────────────────────
storage:
  #! Submit from a data folder inside a synced folder (OneDrive, Dropbox,
  #! Google Drive). Off: a synced profile can be written from two machines
  #! and send the same application twice. AA_ALLOW_SYNCED_PROFILE=1 also
  #! allows it (a development checkout).
  allow_synced_profile: false
  #! auto | removable | fixed. The database's durability on its medium:
  #! fixed → WAL; removable or anything AA cannot tell → DELETE journal with
  #! synchronous=EXTRA (survives a pulled stick or a power cut).
  medium: auto

gpt4all:
  # GGUF model filename — auto-downloaded to ~/.cache/gpt4all/ on first use.
  model: "Meta-Llama-3-8B-Instruct.Q4_0.gguf"
  # Default token budget per generation call.
  max_tokens: 512
  # Sampling temperature. Lower = more deterministic.
  temperature: 0.7
  # Inference device. "cpu" always works; "gpu" requires CUDA/Metal.
  device: "cpu"

# ─── pagecomp access (S3) and transitions (S5) ──────────────────────────────
# Read by the PagecompAccess adapter (adapters/secondary/perception/
# pagecomp_access.py) into a pagecomp ObservationRequest, for every page
# pagecomp reads (serp_reader above).
comprehension_access:
  # "html" (markup only), "dom" (pierced tree) or "layout" (tree + boxes/styles).
  level: "dom"
  # Node cap N per observation; extra nodes are cut and recorded. Measured on
  # the owner's 2-CPU laptop (python -m pagecomp bench, 2026-11-08): 29,000
  # nodes fit the 3 s ceiling; the largest real page seen is 12,899 nodes.
  max_nodes: 29000
  # Byte cap B: characters of text and attribute values per observation.
  max_bytes: 8000000
  # Depth cap; traversal is iterative, deeper subtrees are cut and recorded.
  # The deepest real page seen is 54 levels.
  max_depth: 256
  # Nested frame depth read.
  max_frame_depth: 3
  # Frames read per observation (cross-origin switches included).
  frame_cap: 16
  # Deadline per in-page script call, milliseconds.
  script_deadline_ms: 10000
  # Wall-time budget for the whole observation, all frames, milliseconds.
  wall_ms: 20000
  # Try the CDP rung first on Chromium; false forces the script walk.
  prefer_cdp: true
comprehension_transitions:
  # Settle: consecutive equal readings needed, and the cap T_max in seconds.
  settle_quiet_reads: 2
  settle_t_max_s: 10.0
  # New windows classified per action; the rest are closed (06 s10, ALG-025).
  new_windows_per_action: 4
  # Error template similarity threshold tau for learned error nodes (ALG-001 Ruzicka).
  error_skeleton_tau: 0.7
