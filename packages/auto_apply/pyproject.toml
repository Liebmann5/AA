# /AA/packages/auto_apply/pyproject.toml
# ─────────────────────────────────────────────────────────────────────────────
#  AutoApply (auto_apply) — Package Manifest
#
#  Build backend: hatchling (PEP 517/518 compliant, no extra runtime deps,
#  plays nicely with both `uv build` and `pip install`).
#
#  THIS FILE is the single source of truth for what AA IS:
#    • runtime dependencies
#    • optional feature extras (opt-in, never required for core operation)
#    • declared entry points ([project.scripts] console script, plus
#      `python -m auto_apply` via __main__.py)
#
#  HOW AA is developed — the workspace declaration, the `dev` dependency
#  group (PEP 735), and shared tool configuration — lives in the
#  workspace-root pyproject.toml and is deliberately NOT duplicated here.
#  That group is read by uv, which contributors and CI use. End users
#  installing this package with plain pip never need it.
#
#  Install paths:
#
#    Developer / contributor
#    ────────────────────────
#    pip install uv                   # bootstrap
#    uv sync                          # core + dev tools, from the repo root
#    uv sync --extra nlp              # + SpaCy
#    uv sync --extra browser          # + Playwright
#    uv sync --extra ai               # + GPT4All
#    uv sync --extra all              # everything
#
#    Library / end-user (pip, worst-case)
#    ─────────────────────────────────────
#    pip install auto_apply                  # core only  (~30 MB)
#    pip install "auto_apply[nlp]"           # + SpaCy  (~685 MB model dl separately)
#    pip install "auto_apply[browser]"       # + Playwright
#    pip install "auto_apply[ai]"            # + GPT4All (~4 GB model dl on first run)
#    pip install "auto_apply[nlp,browser]"   # combine extras freely
#    pip install "auto_apply[all]"           # full power-user install
#
#  Portability / USB-drive / frozen-app
#  ─────────────────────────────────────
#    For the IS_FROZEN / --portable path, build with PyInstaller:
#      uv run pyinstaller auto_apply.spec
#    PyInstaller bundles the CPython interpreter + all wheels into a single
#    folder/exe that runs with ZERO host Python or pip required.
#    See docs/portable.md for the full spec file and build pipeline.
#
#  Consent principle: model downloads (SpaCy ~685 MB, GPT4All ~4 GB,
#  Playwright browsers) are performed separately and only with the user's
#  knowledge. AA never downloads anything silently.
# ─────────────────────────────────────────────────────────────────────────────

# ── Build System ─────────────────────────────────────────────────────────────
[build-system]
requires      = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"


# ── Core Metadata (PEP 621) ───────────────────────────────────────────────────
[project]
name            = "auto_apply"
version         = "0.1.0"
description     = "Autonomous agent for discovering, vetting, and applying to job postings."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "Nicholas Liebmann", email = "Liebmann.nicholas1@gmail.com" },
    { name = "Antonio Corona-Sanchez", email = "coronasanchez.antonio@gmail.com" },
]

keywords = ["job-search", "automation", "selenium", "playwright", "ai"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business",
]


# ── Default Stack (~30 MB) ────────────────────────────────────────────────────
# Every dependency here meets the Worst-Case User Contract: works on a 2 GB
# RAM library computer with no admin rights, no API keys, and a
# system-installed browser.
#
# INTENTIONALLY EXCLUDED from core:
#   - playwright     → optional[browser]   (requires separate binary download)
#   - spacy          → optional[nlp]        (685 MB model is too large for default)
#   - gpt4all        → optional[ai]         (4 GB model download on first run)
#   - sentence-transformers → optional[semantic] (separate torch dependency)
#   - SpeechRecognition / pydub / vosk      → optional[captcha]
#   - undetected-chromedriver               → optional[stealth]
#
# NOTE: `requests` is kept for IP-check / static fetches.  The full async HTTP
# path (httpx) is wired in CapabilitiesRegistry when available — graceful upgrade.
dependencies = [
    # ── Validation & Config ───────────────────────────────────────────────────
    "pydantic[email]>=2.5.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",

    # ── Browser Automation (Default: Selenium) ────────────────────────────────
    "selenium>=4.18.0,<5.0.0",

    # ── Static HTML Parsing (Graceful Degradation) ────────────────────────────
    "beautifulsoup4>=4.12.0,<5.0.0",
    "soupsieve>=2.5.0",

    # ── HTTP / Networking ─────────────────────────────────────────────────────
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.1.0,<3.0.0",
    "certifi>=2024.1.0",

    # ── Config / Data Files ───────────────────────────────────────────────────
    "pyyaml>=6.0.1,<7.0.0",

    # ── Security: Profile Encryption ─────────────────────────────────────────
    "cryptography>=42.0.0,<44.0.0",

    # ── System Resource Awareness ─────────────────────────────────────────────
    "psutil>=5.9.0,<7.0.0",

    # ── Formal Logic Reasoning ────────────────────────────────────────────────
    "clingo>=5.7.0",

    # ── CLI Entry Support ─────────────────────────────────────────────────────
    "click>=8.1.0,<9.0.0",
]


# ── Optional Extras ───────────────────────────────────────────────────────────
# Design principle: do NOT bundle a custom download manager.  Use Python
# extras so that pip/uv handles everything with proper hash verification.
#
# CapabilitiesRegistry detects what is installed at runtime and enables
# features accordingly.  Nothing in the critical path ever imports these
# directly.  Dev tooling (pytest, mypy, hypothesis, mkdocs, …) lives in the
# workspace-root dependency group, NOT here.
[project.optional-dependencies]

# ── NLP Tier (Tier 1 — recommended) ──────────────────────────────────────────
# SpaCy en_core_web_lg model must be downloaded separately after install:
#   python -m spacy download en_core_web_lg   # 685 MB, high accuracy
nlp = [
    "spacy>=3.7.0,<4.0.0",
    "click>=8.1.0,<9.0.0",
]

# ── Semantic NLP Tier (Tier 2 — opt-in, higher accuracy) ─────────────────────
semantic = [
    "sentence-transformers>=2.7.0,<4.0.0",
]

# ── Browser Power User (Playwright) ──────────────────────────────────────────
# After installing, download browser binaries once:
#   python -m playwright install firefox      # recommended (smaller, stealthier)
browser = [
    "playwright>=1.43.0,<2.0.0",
]

# ── AI / LLM Tier (Local, Offline) ───────────────────────────────────────────
# GPT4All downloads a GGUF model (~4–8 GB) on first use to ~/.cache/gpt4all/.
ai = [
    "gpt4all>=2.8.0,<3.0.0",
]

# ── CAPTCHA Audio Solver ──────────────────────────────────────────────────────
captcha = [
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.0",
    "vosk>=0.3.45",
]

# ── Stealth / Anti-Detection Upgrades ────────────────────────────────────────
stealth = [
    "undetected-chromedriver>=3.5.5",
]

# ── Research / Data Export ────────────────────────────────────────────────────
research = [
    "pyarrow>=15.0.0",
    "pandas>=2.2.0,<3.0.0",
]

# ── Full Power-User Install ───────────────────────────────────────────────────
all = [
    "auto_apply[nlp,semantic,browser,ai,captcha,stealth,research]",
]


# ── Entry Points ──────────────────────────────────────────────────────────────
# `auto-apply` (console shim, for installed use) and `python -m auto_apply`
# (module entry, for source-mode use) both work. The shim imports
# auto_apply.main, whose top-level pre-import sequence sets AA_DATA_DIR
# before any auto_apply module that resolves data paths is imported — the
# portable-mode sequencing is identical on both entry paths.
[project.scripts]
auto-apply = "auto_apply.main:main"


# ── URLs ──────────────────────────────────────────────────────────────────────
[project.urls]
"Homepage"    = "https://github.com/Liebmann5/AA"
"Bug Tracker" = "https://github.com/Liebmann5/AA/issues"
"Source"      = "https://github.com/Liebmann5/AA/tree/main/packages/auto_apply"
"Personal"    = "https://www.nicholasliebmann.dev/"


# ── Hatchling Build Config ────────────────────────────────────────────────────
# src/ layout: the importable package is at src/auto_apply/.
[tool.hatch.build.targets.wheel]
packages = ["src/auto_apply"]

[tool.hatch.build]
# Package data: the `packages` directive above ships every file under
# src/auto_apply (including resources/, which AA reads at startup via
# importlib.resources). These globs make the intent explicit for the
# resource trees. Validate with `uv build` when the wheel build matters —
# CI does not currently build wheels.
include = [
    "src/auto_apply/resources/**/*.json",
    "src/auto_apply/resources/**/*.yaml",
    "src/auto_apply/adapters/secondary/evasion/detection_config.json",
]


# ── uv Source Overrides (workspace-local only; not published to PyPI) ─────────
[tool.uv.sources]
# auto_apply = { workspace = true }   # uncomment if another member needs it


# ── Per-Package Tool Config ───────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion   = "7.0"
testpaths    = ["tests"]
pythonpath   = ["src"]
addopts      = "--import-mode=importlib"
markers      = [
    "integration: tests that use a real SQLite DB or mock orchestrator",
    "slow: smoke/e2e tests that may need a browser or network access",
    "browser: tests that require a real browser (skipped in CI)",
]

[tool.black]
line-length    = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PL", "T20"]
ignore = [
    "E501",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
